$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: SwapPulse Docs
  structure:
    - type: section
      key: section-2
      title: Landing Page
      path: landing-page
      icon: house-laptop
      default: true
      children:
        - type: space
          key: space-2
          title: Landing Page
          path: landing-page
          default: true
          content:
            directory: ./landing-page
    - type: section
      key: section-1
      title: SwapPulse Docs
      path: swappulse-docs
      children:
        - type: space
          key: space-1
          title: SwapPulse Documentation
          path: docs
          default: true
          content:
            directory: ./docs
    - type: section
      key: section-3
      title: API References
      path: api-references
      icon: rectangle-api
      children:
        - type: space
          key: space-3
          title: API References
          path: api-reference
          default: true
          content:
            directory: ./api-references/api-reference
