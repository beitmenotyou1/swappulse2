services:
  swappulse-lite:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "18100"
      SWAPPULSE_NODE_MANIFEST: /config/swappulse-testnet.json
      SWAPPULSE_RPC_PEERS: ${SWAPPULSE_RPC_PEERS:-}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
      PIN_CHECK_INTERVAL_MS: ${PIN_CHECK_INTERVAL_MS:-300000}
      RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-5000}
      RPC_RATE_LIMIT_PER_MINUTE: ${RPC_RATE_LIMIT_PER_MINUTE:-120}
      CHECKPOINT_PATH: /data/checkpoint.json
    volumes:
      - ../config/swappulse-testnet.json:/config/swappulse-testnet.json:ro
      - ./data:/data
    ports:
      - "127.0.0.1:${SWAPPULSE_LITE_PORT:-18100}:18100"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
